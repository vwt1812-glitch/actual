name: Sync upstream Actual

on:
  push:
    branches: [master]
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into master
        run: |
          git remote add upstream https://github.com/actualbudget/actual.git
          git fetch upstream master
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit upstream/master
            git push origin HEAD:master
          else
            echo "master is already up to date."
          fi
      - name: Merge upstream into receipt-upload branch
        run: |
          git fetch origin puh/receipt-upload
          git config core.autocrlf false
          git config core.safecrlf false
          git checkout --force -B puh/receipt-upload origin/puh/receipt-upload
          git reset --hard origin/puh/receipt-upload
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Working tree is not clean; refusing to merge."
            exit 1
          fi
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit upstream/master
            git push origin HEAD:puh/receipt-upload
          else
            echo "puh/receipt-upload is already up to date."
          fi
