name: Sync upstream Actual

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into master
        run: |
          git remote add upstream https://github.com/actualbudget/actual.git
          git fetch upstream master
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            git merge --no-edit upstream/master
            git push origin HEAD:master
          else
            echo "master is already up to date."
          fi
      - name: Merge upstream into receipt-upload branch
        run: |
          git fetch origin puh/receipt-upload
          git checkout -B puh/receipt-upload origin/puh/receipt-upload
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            git merge --no-edit upstream/master
            git push origin HEAD:puh/receipt-upload
          else
            echo "puh/receipt-upload is already up to date."
          fi
